name: tests

on:
  push:
    branches: [main, integration]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi httpx
      - name: Unit and route tests
        run: python -m pytest tests -q
      - name: Jurisdiction bundle contract
        run: python scripts/validate_jurisdictions.py --json

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Desktop half loads and renders
        run: node scripts/smoke-plugin.mjs
